[package]
name = "remote-vps"
version = "0.3.1"
description = "Ammonite - an SSH desktop environment for a remote Linux server"
authors = ["xreactive"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (rust-lang/cargo#8519).
name = "remote_vps_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "net", "io-util", "time", "macros", "rt-multi-thread", "fs"] }
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4"
chacha20poly1305 = "0.11"
base64 = "0.23"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
